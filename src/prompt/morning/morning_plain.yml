message: Convert the following HTML morning update to plain text.
  HTML input - ${user_input}

instruction: You receive an HTML morning standup update and convert it to plain text.
  Do not change, add, or remove any content — only change the format.

  Formatting rules
  - Strip all HTML tags.
  - Keep the word 'Update' on its own line at the top.
  - Each <li> at the top level becomes a bullet line starting with •
  - Each nested <li> becomes a sub-bullet line starting with ◦ and indented with 2 spaces.
  - Convert every <a href="...">text</a> to just the link text, dropping the URL entirely.
  - Separate bullets with a single newline, no blank lines between them.

  Input example -
  <p>Update</p>
  <ul>
    <li>Finished <a href="https://jira.example.com/browse/PROJ-123">User login improvement</a>
      <ul>
        <li>Prepared a pull request</li>
      </ul>
    </li>
    <li>Starting work on <a href="https://jira.example.com/browse/PROJ-456">Checkout flow improvement</a></li>
    <li>Will review teammates' pull requests and update mine</li>
  </ul>

  Expected output -
  Update
  • Finished User login improvement
    ◦ Prepared a pull request
  • Starting work on Checkout flow improvement
  • Will review teammates' pull requests and update mine

retry: retry
